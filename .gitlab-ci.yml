---
include:
  - project: 'maintenance/teccave_pipeline'
    ref: main
    file: '/.pipeline_defs/.build_image.yml'

# Skip the branch-level gates on the default branch. The identical jobs already
# ran (and passed) on the source branch's pipeline before the merge, so
# re-running them on `main` only wastes runner time. Feature/renovate branch
# pipelines still run them as hard gates. (The image/e2e jobs are already
# restricted to non-default branches by the teccave `.test_image` template.)
.skip_on_default_branch:
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      when: never
    - when: on_success

cargo_test:
  extends: .skip_on_default_branch
  stage: unittest
  image: rust:1.99.1-slim-bookworm@sha256:86234e857a413004348b471d11a4ebe1aa92d2eae2b6b143cac68fd1ac3c48be
  needs: []
  variables:
    MAILBOXD_ROOT_DIR: /tmp/mailboxd-test
    MAILBOXD_ENCRYPT_PASSWORD: ci-test-password
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libssl-dev ca-certificates git
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p "$MAILBOXD_ROOT_DIR"
  script:
    # Disable the `embed-web` feature on the server crate so the frontend
    # (pnpm/node) is not required for unit tests. The feature is exercised
    # separately by `test_build_image`, which builds the full container.
    - cargo test --workspace --locked --no-default-features
  tags:
    - teccave

# Storage-migration coverage as a first-class, visible gate. `cargo_test`
# already runs these as part of the workspace, but a half-broken migration is
# critical enough (it decides whether an existing install can boot at all) to
# warrant an explicit, deterministic run whose failure is unambiguous.
#
# Single-threaded on purpose: the fixtures open real on-disk redb / Tantivy /
# mailboxd-blob stores, so serial execution keeps them independent and
# reproducible. Reuses the build cache produced by `cargo_test` to avoid a
# second full workspace compile.
migration_tests:
  extends: .skip_on_default_branch
  stage: unittest
  image: rust:1.99.1-slim-bookworm@sha256:86234e857a413004348b471d11a4ebe1aa92d2eae2b6b143cac68fd1ac3c48be
  needs:
    - cargo_test
  variables:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - target
    policy: pull
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libssl-dev ca-certificates git
    - rm -rf /var/lib/apt/lists/*
  script:
    # v1.x fjall -> v2, v0.3.7 Tantivy -> v2 (incl. a byte-identical
    # end-to-end fixture), and the guard/idempotency cases.
    - cargo test -p mailboxd-migrate --locked --no-default-features -- --test-threads=1 --nocapture
    # Bichon layout adoption (bichon-* -> mailboxd-*) and the shared core helpers.
    - cargo test -p mailboxd-core --locked --no-default-features migrate -- --test-threads=1
  tags:
    - teccave

# Frontend (web/) checks. Node/pnpm are deliberately kept out of the Rust jobs
# above (see the embed-web note in cargo_test); this is the dedicated frontend
# gate. Mirrors the web-builder stage of the Dockerfile (same image, same pnpm,
# same install invocation) so CI and the release build stay in lockstep.
.web_check:
  extends: .skip_on_default_branch
  stage: unittest
  image: node:24-alpine3.24@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
  needs: []
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  cache:
    key:
      files:
        - web/pnpm-lock.yaml
    paths:
      - web/.pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@12.3.4 --activate
    - cd web
    - pnpm install --frozen-lockfile --config.strict-dep-builds=false --store-dir=.pnpm-store
  tags:
    - teccave

# Hard gate: the frontend must type-check and its unit tests must pass.
web_test:
  extends: .web_check
  script:
    - pnpm exec tsc -b
    - pnpm test

# Hard gate: the frontend must lint clean. The pre-existing violation backlog
# (#16) has been cleared, so lint now blocks the pipeline like web_test.
web_lint:
  extends: .web_check
  script:
    - pnpm run lint

# Hard gate: the production build must boot in a real browser. Unit tests run
# against source modules, so bundling/chunking breakage (e.g. a blank WebUI
# from a bad code-splitting config) only surfaces in the built `dist/`.
web_e2e:
  extends: .web_check
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
  script:
    - pnpm run build
    - pnpm test:e2e
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - web/e2e-results/
    reports:
      junit: web/e2e-results/junit.xml

# Hard gate on the release artifact: boot the freshly built image on an empty
# volume, exactly as an operator would, and drive the real WebUI + API in a
# browser (sign-in, every page, no JS errors, no 5xx, no missing assets).
# `web_e2e` proves the bundle boots; this proves the server ships and serves it.
image_e2e:
  extends: [.web_check, .test_image]
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
  services:
    - name: ${CI_REGISTRY_IMAGE}:${VERSION}
      alias: mailboxd
      variables:
        MAILBOXD_ROOT_DIR: /data
        MAILBOXD_ENCRYPT_PASSWORD: ci-test-password
        MAILBOXD_PUBLIC_URL: http://mailboxd:15630
  variables:
    MAILBOXD_E2E_URL: http://mailboxd:15630
  script:
    - |
      for _ in $(seq 1 60); do
        curl -fsS "$MAILBOXD_E2E_URL/api/status" >/dev/null 2>&1 && break
        sleep 2
      done
    - curl -fsS "$MAILBOXD_E2E_URL/api/status"
    - pnpm test:e2e
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - web/e2e-results/
    reports:
      junit: web/e2e-results/junit.xml

# End-to-end coverage against the actual release artifact: the built container
# image. `cargo_test`/`migration_tests` exercise the Rust logic in isolation;
# these jobs boot the real image the way an operator would, so a broken
# entrypoint, a missing binary, a wrong runtime user/permission or a server
# that refuses to serve is caught before release.
#
# Both run *inside* the freshly built `${CI_REGISTRY_IMAGE}:${VERSION}` image
# (via the teccave `.test_image` template, non-default branches only). The image
# ENTRYPOINT (the `mailboxd-server` binary) is replaced with an empty entrypoint
# so the job script drives startup explicitly and can assert on each step.
# Booting an *old* release image to prove the v1.x/v0.3.7 conversions is not
# possible here (buildkit CI has no Docker daemon and only the new image is
# available), so those paths stay covered by `migration_tests`; these jobs cover
# the artifact itself and the v2 upgrade no-op.
.image_test:
  extends: .test_image
  image:
    name: ${CI_REGISTRY_IMAGE}:${VERSION}
    entrypoint: [""]
  variables:
    MAILBOXD_ROOT_DIR: /data/ci
    MAILBOXD_ENCRYPT_PASSWORD: ci-test-password
    MAILBOXD_BIND_IP: 127.0.0.1
    MAILBOXD_HTTP_PORT: "15630"
  before_script:
    # `start_server` boots the server in the background and blocks until it
    # serves the unauthenticated health endpoint (or fails after ~2 minutes).
    # `stop_server` reaps it. Defined here so both jobs share one implementation;
    # GitLab runs before_script and script in the same shell, so the functions
    # and `$SERVER_PID` persist into the job's script.
    - |
      start_server() {
        /opt/mailboxd/mailboxd-server &
        SERVER_PID=$!
        for _ in $(seq 1 60); do
          if curl -fsS "http://127.0.0.1:${MAILBOXD_HTTP_PORT}/api/status" >/dev/null; then
            return 0
          fi
          sleep 2
        done
        echo "server did not become healthy within timeout" >&2
        kill "$SERVER_PID" 2>/dev/null || true
        return 1
      }
      stop_server() {
        kill "$SERVER_PID" 2>/dev/null || true
        wait "$SERVER_PID" 2>/dev/null || true
      }
    - mkdir -p "$MAILBOXD_ROOT_DIR"

# Boot the release image on a fresh volume and prove it actually serves.
image_integration_test:
  extends: .image_test
  script:
    - start_server
    # A fresh install records the current storage layout (v2).
    - grep -qx "2" "$MAILBOXD_ROOT_DIR/STORAGE_VERSION"
    - stop_server

# Prove an upgrade of an already-v2 volume is a clean, idempotent no-op.
image_update_test:
  extends: .image_test
  script:
    # 1. First start creates a v2 volume (STORAGE_VERSION, blobs, admin user).
    - start_server
    - stop_server
    - grep -qx "2" "$MAILBOXD_ROOT_DIR/STORAGE_VERSION"
    # 2. The standalone migration must be a clean no-op on a v2 volume.
    - MIGRATE_OUT=$(/usr/local/bin/mailboxd-admin --auto-migrate 2>&1); echo "$MIGRATE_OUT"
    - echo "$MIGRATE_OUT" | grep -q "storage layout already current; nothing to do"
    # 3. The server still boots and serves on the migrated volume, unchanged.
    - start_server
    - grep -qx "2" "$MAILBOXD_ROOT_DIR/STORAGE_VERSION"
    - stop_server

.github_mirror:
  stage: release
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  variables:
    GITHUB_REPO: tecbeat/mailboxd
    GHCR_IMAGE: ghcr.io/tecbeat/mailboxd
    GHCR_USER: tecbeat
  tags:
    - teccave

# Copies the released image to GHCR by digest. Needs the masked, protected
# CI variable GHCR_TOKEN (classic PAT, scope write:packages only).
mirror_image:
  extends: .github_mirror
  image:
    name: ghcr.io/regclient/regctl:v0.11.7-alpine@sha256:e9e208e2420fbf9fd47ae24ad4dd4ac40089bd4ead05c1ecd763c43e24fd55b5
    entrypoint: [""]
  needs:
    - job: versioner
      artifacts: true
    - job: build_image
      artifacts: false
  script:
    - |
      if [ "$CHANGED" != "True" ]; then
        echo "versioner reported CHANGED=$CHANGED; nothing to mirror."
        exit 0
      fi
    - echo "$CI_REGISTRY_PASSWORD" | regctl registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --pass-stdin
    - echo "$GHCR_TOKEN" | regctl registry login ghcr.io -u "$GHCR_USER" --pass-stdin
    - regctl image copy "$CI_REGISTRY_IMAGE:$VERSION" "$GHCR_IMAGE:$VERSION"
    - SRC_DIGEST=$(regctl image digest "$CI_REGISTRY_IMAGE:$VERSION")
    - DST_DIGEST=$(regctl image digest "$GHCR_IMAGE:$VERSION")
    - echo "source $SRC_DIGEST, mirror $DST_DIGEST"
    - test "$SRC_DIGEST" = "$DST_DIGEST"

# Publishes the GitLab release notes as a GitHub release. Needs the masked,
# protected CI variable GITHUB_RELEASE_TOKEN (fine-grained PAT, only
# tecbeat/mailboxd, Contents: read and write). Tags reach GitHub only through
# the GitLab push mirror, so the job waits for the mirrored tag instead of
# letting the release API create one.
mirror_release:
  extends: .github_mirror
  image: hub.teccave.de/images/core:v1.4.51@sha256:6d0545e835ab66b6608f3f35be7cbfdd486bfa56b75354a7e30052d587620dba
  needs:
    - job: versioner
      artifacts: true
    - job: changelogger
      artifacts: true
    - job: releaser
      artifacts: false
    - job: mirror_image
      artifacts: false
  variables:
    GITHUB_API: https://api.github.com/repos/tecbeat/mailboxd
    GITHUB_API_VERSION: "2026-03-10"
    MIRROR_WAIT_ATTEMPTS: "30"
    MIRROR_WAIT_SECONDS: "30"
  script:
    - |
      set -euo pipefail

      github_api() {
        local method=$1 path=$2
        shift 2
        curl -sS -X "$method" -o response.json -w '%{http_code}' \
          -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
          "$@" "$GITHUB_API$path"
      }

      json_get() {
        python3 -c 'import json, sys; print(json.load(open("response.json"))[sys.argv[1]])' "$1"
      }

      release_payload() {
        python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["VERSION"], "name": os.environ["VERSION"], "body": open("RELEASE.md", encoding="utf-8").read(), "make_latest": "true"}))'
      }

      gitlab_tag_sha() {
        git fetch --quiet --no-tags origin "refs/tags/$VERSION:refs/tags/$VERSION"
        git rev-parse "$VERSION^{commit}"
      }

      github_tag_sha() {
        git ls-remote --tags "https://github.com/$GITHUB_REPO.git" "$VERSION" "$VERSION^{}" \
          | awk -v ref="refs/tags/$VERSION" '
              $2 == ref        { sha = $1 }
              $2 == ref "^{}"  { peeled = $1 }
              END              { print (peeled != "" ? peeled : sha) }'
      }

      wait_for_mirrored_tag() {
        local expected=$1 actual attempt
        for ((attempt = 1; attempt <= MIRROR_WAIT_ATTEMPTS; attempt++)); do
          actual=$(github_tag_sha) || actual=""
          if [[ -n $actual ]]; then
            [[ $actual == "$expected" ]] && return 0
            echo "GitHub tag $VERSION points to $actual, expected $expected" >&2
            return 1
          fi
          echo "[$attempt/$MIRROR_WAIT_ATTEMPTS] tag $VERSION not mirrored yet; retrying in ${MIRROR_WAIT_SECONDS}s"
          sleep "$MIRROR_WAIT_SECONDS"
        done
        echo "tag $VERSION did not reach GitHub in time" >&2
        return 1
      }

      upsert_release() {
        local status
        release_payload > release.json
        status=$(github_api GET "/releases/tags/$VERSION")
        case $status in
          200) status=$(github_api PATCH "/releases/$(json_get id)" --data @release.json) ;;
          404) status=$(github_api POST "/releases" --data @release.json) ;;
        esac
        if [[ $status != 200 && $status != 201 ]]; then
          echo "GitHub API returned HTTP $status:" >&2
          cat response.json >&2
          return 1
        fi
        echo "GitHub release: $(json_get html_url)"
      }

      if [[ $CHANGED != True ]]; then
        echo "versioner reported CHANGED=$CHANGED; nothing to mirror."
        exit 0
      fi

      tag_sha=$(gitlab_tag_sha)
      echo "GitLab tag $VERSION -> $tag_sha"
      wait_for_mirrored_tag "$tag_sha"
      upsert_release
