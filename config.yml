---
repo:
  tagline: "Self-hosted email archiving in Rust — multi-account IMAP, full-text search, RBAC, OIDC, and an embedded WebUI."

  description: >-
    mailboxd is a self-hosted email archiving server built in Rust and a fork of
    Bichon by rustmailer.com. It concurrently downloads mail from any number of
    IMAP accounts (password or OAuth 2.0), deduplicates content via BLAKE3, indexes
    everything with Tantivy full-text search, and stores raw message content in
    an embedded, content-addressed blob store with Zstd compression. Access is
    via a documented REST API and an embedded
    React WebUI localised into 18 languages. Distributed under AGPL-3.0-or-later.

  command: "docker compose up -d"

  prerequisites:
    Docker: "24.0 or later with the Compose plugin, or a compatible container runtime."
    Storage: "A local filesystem (ext4, XFS) for the data volume. NFS, CIFS and other network filesystems are NOT supported."
    Ports: "One free TCP port for the WebUI/REST API (default 15630). Additional ports if the embedded SMTP (2525) or IMAP (10143/10993) servers are enabled."

  feature:
    Multi-account IMAP download: "Concurrent per-account sync with PLAIN/LOGIN and SASL XOAUTH2, automatic OAuth token refresh with PKCE, and support for SSL/TLS, STARTTLS or plain connections."
    Incremental delta fetch: "UID-based delta fetching downloads only new messages after the initial sync. UIDVALIDITY changes trigger automatic cache rebuilds."
    Fetch scoping: "Filter downloads by date range, mailbox folder limit or specific folder names. Optional per-account SOCKS5 proxy routing."
    Auto-configuration: "Discover IMAP server settings automatically from an email domain."
    Full-text search: "Tantivy indices for envelopes and attachments with Zstd compression. Optimised for European languages."
    Advanced filters: "Date range, size range, attachment presence, file type, content category and facet-based tag combinations."
    Thread grouping: "Reconstruct and view complete conversation threads across folders."
    Attachment search: "Browse and filter attachments by sender, file type, size and other attachment properties."
    Faceted tags: "Add, remove or overwrite tags on messages and attachments; filter by tag combinations with real-time count updates."
    Contacts view: "Extracted and deduplicated sender/recipient address book across all authorised accounts."
    Three-layer storage: "memdb for relational metadata, Tantivy for full-text indexing and mailboxd-blob (embedded, content-addressed, Zstd-compressed) for raw message and attachment storage — all embedded, no external dependencies."
    Content deduplication: "BLAKE3 content hashing gives insert-time deduplication across accounts and folders. Folder moves update metadata only."
    Dashboard analytics: "Email volume trends, top senders, storage usage breakdown, attachment statistics and per-account activity — scoped by user permissions."
    OpenAPI 3.0: "All endpoints documented and browsable via Swagger UI, ReDoc and Scalar. Long-lived API tokens for programmatic access."
    Multi-user RBAC: "5 built-in roles (Admin, Manager, Member, AccountManager, AccountViewer) plus custom roles with 22 granular permissions. Account-level ACLs scope data access per user."
    OpenID Connect SSO: "Authorization Code flow with PKCE against any OIDC provider (Authentik, Keycloak, PocketID, Authelia, Zitadel, Dex). Auto-provisioning of new users with a configurable default role."
    Embedded SMTP receiver: "Optional built-in SMTP server for direct email ingestion. STARTTLS or implicit TLS, AUTH PLAIN/LOGIN with API-token authentication."
    Embedded IMAP server: "Optional read-only IMAP server exposes archived mail to standard email clients (Thunderbird, Outlook, Apple Mail)."
    Import and export: "CLI tools import from EML directories, MBOX files (incl. Gmail's variant), Thunderbird profiles and Outlook PST files. Export as MBOX. All parsing happens server-side."
    Scheduled downloads: "Per-account cron expressions run syncs at specific times — nightly-only or business-hours-only archiving."
    Remote-content blocking: "External images and tracking pixels in emails are blocked by default; users can selectively allow remote content per message."
    Async index dedup: "Duplicate detection in the search index runs asynchronously to reduce write latency during high-throughput ingestion."
    Multi-language WebUI: "React + TypeScript frontend served embedded, localised into 18 languages with light and dark themes."

  configuration:
    Storage & Encryption:
      MAILBOXD_ROOT_DIR:
        required: true
        description: "Absolute path for all persistent data."
      MAILBOXD_ENCRYPT_PASSWORD:
        description: "Password used to encrypt stored credentials (IMAP passwords, OAuth tokens). Alternative: `MAILBOXD_ENCRYPT_PASSWORD_FILE`."
      MAILBOXD_ENCRYPT_PASSWORD_FILE:
        description: "Read the encryption password from a file. If both are set, `MAILBOXD_ENCRYPT_PASSWORD` takes precedence."
      MAILBOXD_INDEX_DIR:
        default: "{root}/mailboxd-indices"
        description: "Tantivy full-text index directory. Place on fast SSD."
      MAILBOXD_DATA_DIR:
        default: "{root}/mailboxd-storage"
        description: "Blob storage directory. Can live on high-capacity HDD."

    Server & Networking:
      MAILBOXD_HTTP_PORT:
        default: 15630
        description: "HTTP server port."
      MAILBOXD_BIND_IP:
        default: "0.0.0.0"
        description: "IP address to bind to (IPv4 or IPv6)."
      MAILBOXD_PUBLIC_URL:
        default: "http://localhost:15630"
        description: "Public-facing URL used in OAuth redirects and docs."
      MAILBOXD_BASE_URL:
        default: "/"
        description: "Base path for the WebUI when behind a reverse proxy (e.g. `/mailboxd`)."
      MAILBOXD_ENABLE_REST_HTTPS:
        default: false
        description: "Serve the REST API over HTTPS (requires a valid certificate)."
      MAILBOXD_HTTP_COMPRESSION_ENABLED:
        default: true
        description: "Enable gzip/brotli/zstd response compression."
      MAILBOXD_WEBUI_TOKEN_EXPIRATION_HOURS:
        default: 168
        description: "Access token lifetime in hours (default 7 days)."
      MAILBOXD_SYNC_CONCURRENCY:
        default: "num_cpus × 2"
        description: "Maximum concurrent account sync tasks."

    Logging:
      MAILBOXD_LOG_LEVEL:
        default: info
        description: "Log level: `trace`, `debug`, `info`, `warn`, `error`."
      MAILBOXD_ANSI_LOGS:
        default: true
        description: "Colorised terminal output."
      MAILBOXD_JSON_LOGS:
        default: false
        description: "JSON-formatted logs for log aggregators."
      MAILBOXD_LOG_TO_FILE:
        default: false
        description: "Persist logs to files under the root dir."
      MAILBOXD_MAX_SERVER_LOG_FILES:
        default: 5
        description: "Maximum log files to retain."

    CORS:
      MAILBOXD_CORS_ORIGINS:
        description: "Comma-separated list of allowed origins. If unset, all origins are allowed; if set, only exact matches pass (no wildcards, no trailing slash)."
      MAILBOXD_CORS_MAX_AGE:
        default: 86400
        description: "CORS preflight cache duration in seconds."

    Upload Limits:
      MAILBOXD_UPLOAD_BODY_LIMIT_MB:
        default: 1100
        description: "Maximum HTTP request body size in MB for file uploads."
      MAILBOXD_WEB_MBOX_UPLOAD_LIMIT_MB:
        default: 1024
        description: "Maximum per-file size in MB for MBOX uploads via the WebUI."
      MAILBOXD_WEB_PST_UPLOAD_LIMIT_MB:
        default: 2048
        description: "Maximum per-file size in MB for PST uploads via the WebUI."

    Embedded SMTP Server:
      MAILBOXD_ENABLE_SMTP:
        default: false
        description: "Enable the embedded SMTP receiver."
      MAILBOXD_SMTP_PORT:
        default: 2525
        description: "SMTP listening port (port 25 may require root)."
      MAILBOXD_SMTP_ENCRYPTION:
        default: starttls
        description: "SMTP encryption mode: `none`, `starttls`, `tls`."
      MAILBOXD_SMTP_AUTH_REQUIRED:
        default: true
        description: "Require authentication for SMTP connections."
      MAILBOXD_TLS_KEY_PATH:
        description: "Absolute path to the SMTP/REST TLS private key."
      MAILBOXD_TLS_CERT_PATH:
        description: "Absolute path to the SMTP/REST TLS certificate chain."

    Embedded IMAP Server:
      MAILBOXD_ENABLE_IMAP:
        default: false
        description: "Enable the embedded read-only IMAP server."
      MAILBOXD_IMAP_PORT:
        default: 10143
        description: "IMAP port (STARTTLS or plaintext)."
      MAILBOXD_IMAPS_PORT:
        default: 10993
        description: "IMAPS port (implicit TLS)."
      MAILBOXD_IMAP_ENCRYPTION:
        default: none
        description: "IMAP encryption mode: `none`, `starttls`, `tls`."

    OIDC Single Sign-On:
      MAILBOXD_OIDC_ENABLED:
        default: false
        description: "Enable OIDC single sign-on. When `true`, the four settings below are required."
      MAILBOXD_OIDC_ISSUER_URL:
        description: "Issuer URL of the OIDC provider (without the `/.well-known/openid-configuration` suffix)."
      MAILBOXD_OIDC_CLIENT_ID:
        description: "OAuth 2.0 client ID registered with the IdP."
      MAILBOXD_OIDC_CLIENT_SECRET:
        description: "OAuth 2.0 client secret registered with the IdP."
      MAILBOXD_OIDC_REDIRECT_URI:
        description: "Redirect URI registered with the IdP. Must resolve to `<public-url>/api/auth/oidc/callback`."
      MAILBOXD_OIDC_DEFAULT_ROLE_ID:
        default: 100200000000000
        description: "Global role ID assigned to auto-provisioned OIDC users (built-in `Member`)."
      MAILBOXD_OIDC_AUTO_REDIRECT:
        default: false
        description: "When OIDC is configured, `/sign-in` redirects to the IdP immediately. The local login form remains reachable via `/sign-in?local=1`."

  development: >-
    Prerequisites: Rust (latest stable), Node.js 20+, pnpm.
    Clone the repo and run `cargo build` — the frontend is installed and built
    automatically via `build.rs`. For frontend development run
    `cd web && pnpm run dev` for a Vite dev server with API proxy to the Rust
    backend. See [CONTRIBUTING guidelines](https://git.teccave.de/tecbeat/mailboxd/-/blob/main/README.md#contributing).

  stack: >-
    **Backend:** Rust, Tokio, Poem + Poem OpenAPI.
    **Full-text search:** Tantivy (Zstd compression).
    **Blob storage:** mailboxd-blob (embedded content-addressed store, Zstd compression, BLAKE3 dedup).
    **Metadata DB:** memdb (embedded key-value store with WAL).
    **IMAP:** async-imap, rustls (ring), SOCKS5 proxy support.
    **SMTP/IMAP servers:** embedded (AUTH PLAIN/LOGIN, STARTTLS/TLS).
    **Cryptography:** AES-256-GCM (ring), BLAKE3 (content hashing).
    **Frontend:** React 18, TypeScript, Vite, ShadCN UI, TanStack Router/Query/Table.
    **i18n:** i18next (18 languages).
    **Container:** Ubuntu 24.04, Docker.

  faq:
    "Upgrading from Bichon 2.x": >-
      mailboxd is a drop-in successor to Bichon 2.x and reuses the same
      on-disk format (storage version 2). To migrate: stop Bichon, swap the
      container image for mailboxd, and rename every `BICHON_*` environment
      variable to `MAILBOXD_*` (e.g. `BICHON_ROOT_DIR` → `MAILBOXD_ROOT_DIR`),
      keeping the **same** `MAILBOXD_ENCRYPT_PASSWORD` as your previous
      `BICHON_ENCRYPT_PASSWORD` so stored IMAP and OAuth credentials remain
      decryptable. Point `MAILBOXD_ROOT_DIR` at your existing Bichon data
      volume and start the container — on first boot mailboxd renames the
      `bichon-indices` and `bichon-storage` directories to `mailboxd-indices`
      and `mailboxd-storage` and adopts the database in place, with no
      re-download and no re-index. Existing users, roles, accounts and
      archived mail are preserved; sign in with your previous credentials.
      Back up the data volume before upgrading.
    "Upgrading from an older data layout (storage v1 or v0.3.7)": >-
      Older installs used earlier on-disk layouts — the fjall-based v1.x blob
      storage (Bichon 1.x era) or the Tantivy-based v0.3.7 layout. mailboxd
      migrates these to the current v2 layout automatically on first boot: the
      container runs the migration **before** starting the server, with no
      operator interaction. The migration is non-destructive and idempotent —
      it reads the legacy data, writes the v2 store alongside it and records a
      `STORAGE_VERSION` marker — so it is a no-op on volumes already on v2 and
      safe to run on every start. Just swap the image for the new version and
      start the container. If migration fails the container refuses to start
      rather than run the server against half-converted data; check the
      `[auto-migrate]` log lines. A partially-completed v0.3.7 migration is not
      resumed automatically — run the interactive `mailboxd-admin` tool in that
      case. **Back up the data volume before upgrading.**
    "CORS errors when accessing the WebUI": >-
      Enable debug logging with `MAILBOXD_LOG_LEVEL=debug`, check the server logs
      for the incoming `Origin` header, and ensure the browser's exact origin
      matches an entry in `MAILBOXD_CORS_ORIGINS` (no trailing slash, no
      wildcards). In Docker, do not wrap the value in quotes.
    "How do I run mailboxd behind a reverse proxy?": >-
      Set `MAILBOXD_BASE_URL=/mailboxd` (or your sub-path) and configure your
      proxy to forward `/mailboxd/` to `http://127.0.0.1:15630/`, preserving
      `Host` and `X-Forwarded-For` headers.
    "Can mailboxd send emails?": >-
      No. mailboxd is an **archiver**, not an email client. The optional SMTP
      server only **receives** emails — it cannot send, forward or reply. The
      optional IMAP server is read-only.
    "What hardware does mailboxd need?": >-
      Recommended: 4+ CPU cores, 2+ GB RAM (sufficient for 10+ accounts and
      200+ GB of archived data). Use a mainstream local filesystem (ext4, XFS);
      avoid network/virtual filesystems (NFS, SMB, VirtIO-FS) for all data
      directories. Indices benefit from SSD storage; blob storage can use HDD.
    "How do I reset the admin password?": >-
      Run the `mailboxd-admin` binary inside the container
      (`docker exec -it mailboxd mailboxd-admin`) and select
      *Reset Admin Password*. `MAILBOXD_ENCRYPT_PASSWORD` (or its `_FILE`
      counterpart) must be set for the tool to decrypt stored credentials.
    "How do I back up my data?": >-
      Back up the entire `MAILBOXD_ROOT_DIR` (plus `MAILBOXD_INDEX_DIR` and
      `MAILBOXD_DATA_DIR` if overridden). All three storage layers must be
      backed up together for consistency. Do not place any of these directories
      on network-mounted storage — sync locally, then rsync to a remote
      destination.
    "Default login credentials?": >-
      On first start, mailboxd creates a built-in admin user with username
      `admin` and password `admin@mailboxd`. **Change the password immediately**
      via *Settings → Profile* in the WebUI.
